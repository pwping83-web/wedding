<div style="margin:0;padding:24px 12px;background:#F0EDE8;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;margin:0 auto;background:#FFFFFF;border-radius:16px;overflow:hidden;border:1px solid #E8E5E0;">
    <!-- 헤더 -->
    <tr>
      <td style="padding:32px 28px 24px;background:linear-gradient(135deg,#F7F2FA 0%,#FAF0ED 100%);text-align:center;border-bottom:1px solid #ECE8E3;">
        <p style="margin:0 0 8px;font-size:12px;font-weight:600;color:#7B6FA8;letter-spacing:0.1em;">WEDDING CUE SHEET</p>
        <h1 style="margin:0 0 12px;font-size:26px;font-weight:700;color:#1A1A1A;line-height:1.35;">
          {{groom_name}} · {{bride_name}}
        </h1>
        <p style="margin:0;font-size:14px;color:#666;line-height:1.7;">
          {{ceremony_date}} · {{ceremony_time}}<br/>
          {{venue}}
        </p>
        <p style="margin:10px 0 0;font-size:12px;color:#8A8580;">분위기: {{mood_label}}</p>
      </td>
    </tr>

    <!-- 큐시트 본문 -->
    <tr>
      <td style="padding:8px 28px 28px;">
        <p style="margin:0 0 12px;font-size:13px;font-weight:700;color:#7B6FA8;letter-spacing:0.04em;">식순 · MC 멘트</p>
        <div style="padding:18px 20px;background:#FAFAF8;border-radius:12px;border:1px solid #ECE8E3;font-size:13px;line-height:1.85;color:#333;white-space:pre-line;word-break:keep-all;">
{{mc_cue_sheet}}
        </div>
      </td>
    </tr>

    <!-- 푸터 -->
    <tr>
      <td style="padding:18px 28px 24px;background:#FAFAF8;border-top:1px solid #ECE8E3;text-align:center;">
        <p style="margin:0;font-size:12px;color:#8A8580;line-height:1.7;">
          AI 자동 식순 큐시트 · 사회자 전달용<br/>
          tseizou@naver.com
        </p>
      </td>
    </tr>
  </table>
</div>
