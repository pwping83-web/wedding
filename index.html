<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>웨딩 큐시트</title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <div
      id="boot-fallback"
      style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,-apple-system,sans-serif;background:#F4F3F0;color:#1A1A1A;text-align:center"
    >
      <div>
        <p style="font-size:15px;font-weight:600;margin:0 0 8px">웨딩 큐시트 불러오는 중…</p>
        <p id="boot-fallback-hint" style="font-size:13px;color:#8A8580;margin:0">잠시만 기다려 주세요</p>
      </div>
    </div>
    <script>
      ;(function () {
        var removed = false
        function hideFallback() {
          if (removed) return
          var root = document.getElementById('root')
          var fb = document.getElementById('boot-fallback')
          if (root && root.children.length && fb) {
            fb.remove()
            removed = true
          }
        }
        var observer = new MutationObserver(hideFallback)
        observer.observe(document.getElementById('root'), { childList: true, subtree: true })
        window.addEventListener('load', hideFallback)
        setInterval(hideFallback, 200)
        setTimeout(function () {
          if (removed) return
          var hint = document.getElementById('boot-fallback-hint')
          if (hint) {
            hint.innerHTML =
              '화면이 비어 있으면 <button type="button" onclick="location.reload()" style="margin-top:8px;padding:10px 16px;border:none;border-radius:10px;background:#7B6FA8;color:#fff;font-size:14px;font-weight:600;cursor:pointer">새로고침</button>'
          }
        }, 6000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
